services:
  - type: web
    name: scout
    runtime: docker
    plan: free
    envVars:
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        fromService:
          name: scout
          type: web
          property: hostport
    disk:
      name: data
      mountPath: /app/data
      sizeGB: 1