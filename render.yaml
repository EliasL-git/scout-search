services:
  - type: web
    name: scout
    runtime: docker
    plan: free
    envVars:
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        fromService:
          name: scout
          type: web
          property: hostport
      - key: DATABASE_URL
        fromDatabase:
          name: scout-db
          property: connectionString

databases:
  - name: scout-db
    plan: free